<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>لوحة التحكم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400&display=swap">
<style>
:root{--olive:#46502A;--deep:#2F371D;--ink:#2B2312;--beige:#F2E8D5;--sand:#E4D6B8;--orange:#E8863A;--line:rgba(242,232,213,.18);--red:#C4472A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--deep);color:var(--beige);font:400 17px/1.6 'Cairo',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 90px}
h1,h2,h3{margin:0;font-weight:400}
/* login */
.login{min-height:100svh;display:grid;place-items:center;padding:20px}
.card{background:var(--olive);border:1px solid var(--line);border-radius:22px;padding:28px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.card h1{font-size:30px;color:var(--orange)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{color:var(--sand);font-size:15px}
input,select,textarea{background:#F2E8D5;color:var(--ink);border:2px solid transparent;border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange)}
.btn{text-decoration:none;min-height:46px;padding:0 20px;border-radius:999px;border:0;background:var(--orange);color:var(--ink)}
.btn.sec{background:transparent;color:var(--beige);border:1.5px solid var(--line)}
.btn.red{background:transparent;color:#F0A08A;border:1.5px solid rgba(240,160,138,.45)}
.btn.sm{min-height:36px;padding:0 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.err{color:#F0A08A;min-height:24px;font-size:15px}
/* shell */
.top{position:sticky;top:0;z-index:10;background:var(--deep);border-bottom:1px solid var(--line)}
.top .in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.top b{font-weight:400;font-size:19px;color:var(--orange)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:1000px;margin:0 auto;scrollbar-width:none}
.tab{white-space:nowrap;border:1.5px solid var(--line);background:none;border-radius:999px;min-height:42px;padding:0 16px;position:relative}
.tab.on{background:var(--orange);color:var(--ink);border-color:var(--orange)}
.dot{display:inline-block;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:13px;line-height:20px;text-align:center;margin-inline-start:6px;padding:0 5px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:12px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:none;border-radius:999px;min-height:38px;padding:0 14px;font-size:15px}
.chip.on{background:var(--beige);color:var(--ink)}
.row{background:var(--olive);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.row .th{width:64px;height:64px;border-radius:12px;background:#F2E8D5;object-fit:contain;flex:none;display:grid;place-items:center;color:#6B5440;font-size:12px}
.row .tx{flex:1;min-width:0}
.row .tx b{font-weight:400;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx small{color:var(--sand)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.off{opacity:.55}
.empty{padding:40px 10px;text-align:center;color:var(--sand)}
/* modal */
.mask{position:fixed;inset:0;background:rgba(20,24,10,.78);z-index:50;overflow:auto;padding:16px}
.modal{background:var(--olive);border:1px solid var(--line);border-radius:22px;max-width:640px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:24px;color:var(--orange)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.g2{grid-template-columns:1fr}.row{flex-wrap:wrap}}
.sz{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px;align-items:end}
.sz .fld>span{font-size:13px}
.sz4{display:grid;grid-template-columns:1.4fr 1fr 1fr .8fr auto;gap:8px;align-items:end}
.sz4 .fld>span{font-size:13px}
@media(max-width:520px){.sz4{grid-template-columns:1fr 1fr}.sz4 .fld:first-child{grid-column:1/-1}}
.crop{display:flex;flex-direction:column;gap:12px;align-items:center}
.crop canvas{width:min(86vw,380px);height:min(86vw,380px);border-radius:14px;border:2px solid var(--orange);touch-action:none;cursor:grab;background:repeating-conic-gradient(#d9d2c0 0 25%,#f2e8d5 0 50%) 0 0/20px 20px}
.crop .tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.crop input[type=range]{width:min(86vw,380px)}
.imgs{display:flex;flex-wrap:wrap;gap:10px}
.im{position:relative;width:92px;height:92px;border-radius:12px;background:#F2E8D5;overflow:hidden}
.im img{width:100%;height:100%;object-fit:contain}
.im button{position:absolute;top:4px;inset-inline-start:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(43,35,18,.85);color:#fff;font-size:16px;line-height:1;padding:0}
.im i{position:absolute;bottom:0;inset-inline:0;background:var(--orange);color:var(--ink);font-size:12px;text-align:center;font-style:normal}
.up{width:92px;height:92px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:14px;color:var(--sand);background:none}
.hint{color:var(--sand);font-size:14px}
.toast{position:fixed;bottom:20px;inset-inline:16px;margin:auto;max-width:420px;background:var(--beige);color:var(--ink);border-radius:14px;padding:12px 16px;z-index:90;text-align:center}
/* texts */
.sec h3{font-size:20px;color:var(--orange);margin:22px 0 8px}
.trow{background:var(--olive);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.trow.ed{border-color:var(--orange)}
.trow small{color:var(--sand)}
.trow .acts{justify-content:flex-end}
.pill{display:inline-block;border-radius:999px;padding:0 10px;font-size:13px;background:rgba(242,232,213,.14)}
.ord{background:var(--olive);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.ord.new{border-color:var(--orange);box-shadow:0 0 0 2px rgba(232,134,58,.35)}
.ord .oimg{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ord .oimg img{width:110px;height:110px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;background:#0003}.lb{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}.lb img{max-width:100%;max-height:100%;border-radius:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--olive);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi b{display:block;font-weight:400;font-size:30px;color:var(--orange);line-height:1.2}
.kpi span{color:var(--sand);font-size:14px}
.pn{background:var(--olive);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.pn h3{font-size:19px;color:var(--orange);margin-bottom:10px}
.hb{display:flex;align-items:flex-end;gap:3px;height:120px;direction:ltr}
.hb i{flex:1;background:var(--orange);border-radius:4px 4px 0 0;min-height:2px;position:relative;opacity:.85}
.hb i.pk{background:var(--beige);opacity:1}
.hl{display:flex;gap:3px;direction:ltr;font-size:11px;color:var(--sand);margin-top:4px}.hl span{flex:1;text-align:center}
.tb{width:100%;border-collapse:collapse;font-size:15px}.tb th,.tb td{padding:8px 6px;text-align:start;border-bottom:1px solid var(--line)}.tb th{color:var(--sand)}
.tb td.n{text-align:center;color:var(--beige)}
.mb{height:8px;border-radius:4px;background:var(--orange);margin-top:4px}
.ord .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.ord a{color:var(--orange)}
.ord ul{margin:0;padding-inline-start:20px}
</style>
</head>
